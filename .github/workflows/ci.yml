name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: pre-commit/action@v3.0.1

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Tests only Humble since the `ros2` branch tests later distros.
          - ros: humble
            os: ubuntu-22.04

    name: ROS 2 ${{ matrix.ros }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - uses: ros-tooling/setup-ros@v0.7

      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ matrix.ros }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian package for integration test
        run: |
          echo "Building Debian package for integration tests"
          ./build-deb.sh amd64

      - name: Run integration tests
        timeout-minutes: 15
        run: |
          echo "Running integration tests..."
          
          # Clean up any previous results
          rm -rf test/integration-test/results/*.json
          
          # Start the test environment and run tests from root directory
          echo "🚀 Starting integration test environment..."
          cd test/integration-test
          
          # Build all services first
          docker compose build
          
          # Then run the test
          docker compose up --abort-on-container-exit test-client
          
          # Show container logs if test fails
          echo "📝 Container logs:"
          docker compose logs rosbridge-server || true
          docker compose logs test-client || true
          
          # Check test results
          if [ -f results/test-summary.json ]; then
            echo "📊 Test summary:"
            cat results/test-summary.json
            echo ""
            
            # List all result files
            echo "📁 Generated test files:"
            ls -la results/
            echo ""
            
            # Check if tests passed
            if grep -q '"overall_status": "PASSED"' results/test-summary.json; then
              echo "✅ Integration tests PASSED"
              
              # Show individual test results
              echo "📋 Individual test results:"
              for file in results/test-results-*.json; do
                if [ -f "$file" ]; then
                  echo "  - $(basename "$file"):"
                  jq -r '.mode + " mode: " + .overall_status' "$file" 2>/dev/null || echo "    Unable to parse"
                fi
              done
              
              exit 0
            else
              echo "❌ Integration tests FAILED"
              
              # Show failure details
              echo "🔍 Failure details:"
              for file in results/test-results-*.json; do
                if [ -f "$file" ]; then
                  echo "  - $(basename "$file"):"
                  jq -r '.mode + " mode: " + (.overall_status // "UNKNOWN")' "$file" 2>/dev/null || echo "    Unable to parse"
                fi
              done
              
              exit 1
            fi
          else
            echo "❌ No test results found"
            echo "🔍 Container logs:"
            docker compose logs test-client | tail -50
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test/integration-test/results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            test/integration-test/results/
          retention-days: 7
          if-no-files-found: ignore
