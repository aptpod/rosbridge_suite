name: Build Debian Packages

on:
  push:
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, armhf]
      fail-fast: false  # Continue other builds even if one fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up QEMU for cross-compilation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Debian package for ${{ matrix.arch }}
      run: |
        echo "Building Debian package for ${{ matrix.arch }}"
        ./build-deb.sh ${{ matrix.arch }}
        
    - name: List generated packages
      run: |
        echo "Generated packages:"
        ls -la debian-packages/
        
    - name: Verify package integrity
      run: |
        echo "Verifying package integrity for ${{ matrix.arch }}"
        for deb in debian-packages/*.deb; do
          echo "Checking $deb:"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | head -20
        done
        
    - name: Upload Debian packages
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-${{ matrix.arch }}
        path: |
          debian-packages/*.deb
          debian-packages/INSTALL.md
        retention-days: 1
        if-no-files-found: error
        
    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.arch }}
        path: |
          build/
          log/
        retention-days: 1
        if-no-files-found: ignore

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: Create build summary
      run: |
        echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Generated Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        for arch in amd64 arm64 armhf; do
          if [ -d "artifacts/debian-packages-$arch" ]; then
            echo "### $arch" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Successfully built**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Packages:" >> $GITHUB_STEP_SUMMARY
            for pkg in artifacts/debian-packages-$arch/*.deb; do
              if [ -f "$pkg" ]; then
                size=$(stat -c%s "$pkg" 2>/dev/null || stat -f%z "$pkg" 2>/dev/null || echo "unknown")
                echo "- $(basename "$pkg") (${size} bytes)" >> $GITHUB_STEP_SUMMARY
              fi
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### $arch" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        echo "## BSON Support Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All packages include BSON serialization support for improved performance with binary data." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Installation Instructions" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Download the appropriate package for your architecture" >> $GITHUB_STEP_SUMMARY
        echo "# Install dependencies" >> $GITHUB_STEP_SUMMARY
        echo "sudo apt update" >> $GITHUB_STEP_SUMMARY
        echo "sudo apt install -y python3-twisted python3-tornado python3-autobahn python3-pymongo python3-pil" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Install the package" >> $GITHUB_STEP_SUMMARY
        echo "sudo dpkg -i ros-humble-rosbridge-suite_*.deb" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Use the package" >> $GITHUB_STEP_SUMMARY
        echo "source /opt/ros/humble/setup.bash" >> $GITHUB_STEP_SUMMARY
        echo "ros2 launch rosbridge_server rosbridge_websocket_launch.xml" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        
    - name: List all artifacts
      run: |
        echo "Available artifacts:"
        find artifacts/ -type f -name "*.deb" -exec ls -la {} \;