services:
  # Base ROS 2 Humble environment
  ros-master:
    image: ros:humble
    environment:
      - ROS_DOMAIN_ID=42
    command: /bin/bash -c "source /opt/ros/humble/setup.bash && sleep infinity"
    networks:
      - ros-network

  # Chatter talker node
  chatter-talker:
    image: ros:humble
    environment:
      - ROS_DOMAIN_ID=42
    command: >
      /bin/bash -c "
        source /opt/ros/humble/setup.bash &&
        apt-get update &&
        apt-get install -y ros-humble-demo-nodes-cpp &&
        ros2 run demo_nodes_cpp talker
      "
    depends_on:
      - ros-master
    networks:
      - ros-network

  # PointCloud2 publisher node
  pointcloud2-publisher:
    image: ros:humble
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./scripts:/workspace/scripts:ro
    command: >
      /bin/bash -c "
        source /opt/ros/humble/setup.bash &&
        apt-get update &&
        apt-get install -y python3-numpy ros-humble-sensor-msgs &&
        python3 /workspace/scripts/pointcloud2_publisher.py
      "
    depends_on:
      - ros-master
    networks:
      - ros-network

  # Echo service nodes for testing
  echo-services:
    image: ros:humble
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./scripts:/workspace/scripts:ro
    command: >
      /bin/bash -c "
        source /opt/ros/humble/setup.bash &&
        apt-get update &&
        apt-get install -y ros-humble-example-interfaces ros-humble-std-srvs &&
        python3 /workspace/scripts/echo_services.py
      "
    depends_on:
      - ros-master
    networks:
      - ros-network


  # ROS nodes container (includes all publishers and services)
  ros_nodes:
    image: ros:humble
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./scripts:/app/scripts:ro
    command: >
      /bin/bash -c "
        set -ex

        # Install packages first
        echo '[INSTALL] Installing required packages...'
        apt-get update -qq
        apt-get install -y -qq python3-numpy ros-humble-sensor-msgs ros-humble-demo-nodes-cpp ros-humble-example-interfaces ros-humble-std-srvs
        echo '[INSTALL] Package installation completed successfully'

        # Source ROS environment after installation
        source /opt/ros/humble/setup.bash

        # Verify talker is available
        echo '[VERIFY] Checking demo_nodes_cpp talker availability...'
        ros2 pkg executables demo_nodes_cpp | grep talker || (echo 'ERROR: talker not found' && exit 1)

        # Start services in background without PID management issues
        echo '[START] Starting echo services...'
        python3 /app/scripts/echo_services.py &
        sleep 3

        echo '[START] Starting chatter publisher (Python)...'
        python3 /app/scripts/chatter_publisher.py &
        sleep 3

        echo '[START] Starting PointCloud2 publisher...'
        python3 /app/scripts/pointcloud2_publisher.py &
        sleep 5

        # Topic verification and diagnosis
        echo '[VERIFY] Waiting for topics to be ready...'
        sleep 10

        echo '[DEBUG] Available ROS topics:'
        ros2 topic list || echo 'Failed to list topics'

        echo '[DEBUG] Chatter topic info:'
        ros2 topic info /chatter || echo 'Chatter topic not found'

        echo '[DEBUG] Echo chatter messages (5 seconds):'
        timeout 5 ros2 topic echo /chatter std_msgs/msg/String || echo 'No chatter messages received'

        echo '[DEBUG] Active topics:'
        ros2 topic list

        echo '[READY] All ROS nodes started successfully'
        echo '[READY] Topics available: /chatter, /pointcloud, and services'

        # Keep container running and wait for all background processes
        echo '[INFO] Container ready for testing. Keeping alive...'
        sleep infinity
      "
    depends_on:
      - ros-master
    networks:
      - ros-network

  # Rosbridge server in JSON mode (default)
  rosbridge:
    build:
      context: ../..
      dockerfile: test/integration-test/Dockerfile.rosbridge
    environment:
      - ROS_DOMAIN_ID=42
      - BSON_ONLY_MODE=false  # JSON mode
    ports:
      - "9090:9090"
    depends_on:
      - ros-master
      - ros_nodes
    networks:
      - ros-network

  # Rosbridge server in BSON-only mode
  rosbridge-bson:
    build:
      context: ../..
      dockerfile: test/integration-test/Dockerfile.rosbridge
    environment:
      - ROS_DOMAIN_ID=42
      - BSON_ONLY_MODE=true  # BSON-only mode
    ports:
      - "9091:9090"
    depends_on:
      - ros-master
      - ros_nodes
    networks:
      - ros-network
    profiles:
      - bson

  # Test client for JSON/BSON testing and benchmarks
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - ROSBRIDGE_URL=ws://rosbridge:9090
      - ROSBRIDGE_URL_BSON=ws://rosbridge-bson:9090
      - RESULTS_DIR=/app/results
    volumes:
      - ./client:/app/client:ro
      - ./results:/app/results
    command: >
      /bin/bash -c "
        sleep 10 &&
        python3 /app/client/test_all.py
      "
    depends_on:
      - rosbridge
    networks:
      - ros-network
    profiles:
      - test

networks:
  ros-network:
    driver: bridge
